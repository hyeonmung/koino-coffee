<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/koi-logo.png" />
    <link rel="apple-touch-icon" href="/brand/koi-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KOINONIA ROASTERS 공식사이트</title>
    <meta name="description" content="좋은 원두를 정직하게, 그 맛을 쉽게. 코이노니아 로스터스의 원두, 브루 가이드, 커피 이야기를 만나보세요." />

    <!-- Static Open Graph / Twitter Card tags — this is a client-rendered SPA, so link-preview
         crawlers (KakaoTalk, Facebook, etc.) that don't execute JavaScript only ever see these
         tags, never the per-page ones <SEO> injects at runtime via react-helmet-async. Keeping
         one good default here is what makes shared links show a card instead of plain text. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KOINONIA ROASTERS 공식사이트" />
    <meta property="og:title" content="KOINONIA ROASTERS 공식사이트" />
    <meta property="og:description" content="좋은 원두를 정직하게, 그 맛을 쉽게. 코이노니아 로스터스의 원두, 브루 가이드, 커피 이야기를 만나보세요." />
    <meta property="og:image" content="https://koinoniaroasters.co.kr/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://koinoniaroasters.co.kr/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KOINONIA ROASTERS 공식사이트" />
    <meta name="twitter:description" content="좋은 원두를 정직하게, 그 맛을 쉽게. 코이노니아 로스터스의 원두, 브루 가이드, 커피 이야기를 만나보세요." />
    <meta name="twitter:image" content="https://koinoniaroasters.co.kr/og-image.png" />

    <link rel="preload" href="/fonts/SUIT-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // One-time compatibility shim: this site used to run on HashRouter (URLs like
      // /#/coffees/x). Any link, QR code, or bookmark printed/shared before the switch to
      // clean URLs still lands here with a #/ hash — rewrite it to the real path before the
      // router mounts so those old links keep working instead of silently 404ing.
      if (location.hash.indexOf('#/') === 0) {
        history.replaceState(null, '', location.hash.slice(1) + location.search)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
